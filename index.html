<!doctype html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profesionalno Fotografiranje Proizvoda</title>
  <meta name="description" content="Profesionalno fotografiranje proizvoda na hrvatskom, engleskom, španjolskom i njemačkom jeziku." />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="language-portal">
  <main class="portal-wrap">
    <p class="eyebrow">Visual Commerce Studio</p>
    <h1>Odaberite Jezik</h1>
    <p>Profesionalno fotografiranje proizvoda za web trgovine, kataloge i kampanje.</p>
    <div class="language-grid">
      <a href="hr/" lang="hr">Hrvatski</a>
      <a href="en/" lang="en">English</a>
      <a href="es/" lang="es">Español</a>
      <a href="de/" lang="de">Deutsch</a>
    </div>
  </main>
  <script>
    (function () {
      var lang = (navigator.language || "en").toLowerCase();
      var target = "hr/";
      if (lang.indexOf("hr") === 0) target = "hr/";
      else if (lang.indexOf("es") === 0) target = "es/";
      else if (lang.indexOf("de") === 0) target = "de/";
      setTimeout(function () {
        window.location.href = target;
      }, 900);
    })();
  </script>
</body>
</html>
